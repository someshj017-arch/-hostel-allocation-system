<!DOCTYPE html>
<html>
<head>
    <title>Hostel Room Allocation System</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; margin: 0; padding: 0; }
        nav { background: #1e3a8a; color: white; padding: 15px; }
        nav h1 { margin: 0 0 10px 0; font-size: 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        main { max-width: 900px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #1e3a8a; color: white; }
        .flash { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .flash.success { background: #d4edda; color: #155724; }
        .flash.error { background: #f8d7da; color: #721c24; }
        button { background: #1e3a8a; color: rgb(248, 232, 232); padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <h1>🏠 Hostel Room Allocation</h1>
        <a href="/">Home</a>
        <a href="/availability">Availability</a>
        <a href="/students">Students</a>
        <a href="/allocate">Allocate Room</a>
        <a href="/allocations">All Allocations</a>
    </nav>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
